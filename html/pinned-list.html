<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <script src="../js/utils/theme-early.js"></script>
  <link rel="stylesheet" href="../css/pinned-list.css" />
  <title data-i18n="pinnedTabsTitle">Pinned Tab List</title>
</head>

<body>
  <div class="search-container">
    <img id="magnifying-glass" src="../images/magnifying-glass.png" alt data-i18n="search" />
    <input id="search-input" aria-label="search pinned tabs" type="text" placeholder="search pinned tabs...">
    <div id="tab-count">Loading...</div>
  </div>
  <div class="tab-list-container">
    <ul id="pinned-tab-list"></ul>
  </div>

  <!-- URL 匹配确认弹窗 -->
  <div id="url-match-confirm-dialog" class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title" style="display: none;">
    <div class="confirm-dialog-overlay"></div>
    <div class="confirm-dialog-content">
      <div id="confirm-dialog-title" class="confirm-dialog-title" data-i18n="urlMatchTitle">找到相似页面</div>
      <div class="confirm-dialog-body">
        <div class="confirm-dialog-section">
          <div class="confirm-dialog-label" data-i18n="pinnedPage">固定的页面：</div>
          <div id="confirm-target-title" class="confirm-dialog-title-text" aria-label="固定的页面标题"></div>
          <div id="confirm-target-url" class="confirm-dialog-url" aria-label="固定的页面URL"></div>
        </div>
        <div class="confirm-dialog-section">
          <div id="confirm-matched-label" class="confirm-dialog-label" data-i18n="matchedPage">已打开的相似页面：</div>
          <!-- 单候选：显示标题+URL（原有行为） -->
          <div id="confirm-single-match" style="display: none;">
            <div id="confirm-matched-title" class="confirm-dialog-title-text" aria-label="已打开的相似页面标题"></div>
            <div id="confirm-matched-url" class="confirm-dialog-url" aria-label="已打开的相似页面URL"></div>
          </div>
          <!-- 多候选：列表展示，可点击选择 -->
          <div id="confirm-candidates-list" class="confirm-candidates-list" role="radiogroup" aria-label="候选页面列表" style="display: none;">
          </div>
        </div>
        <div id="confirm-match-info" class="confirm-dialog-info" aria-live="polite"></div>
      </div>
      <div class="confirm-dialog-actions" role="group" aria-label="操作按钮">
        <button id="confirm-switch-only-btn" class="confirm-btn confirm-btn-primary" data-i18n="jumpOnly">仅跳转（不更新）</button>
        <button id="confirm-switch-update-btn" class="confirm-btn confirm-btn-secondary" data-i18n="updateAndJump">更新并跳转</button>
        <button id="confirm-open-new-btn" class="confirm-btn confirm-btn-tertiary" data-i18n="openNew">新页面打开</button>
        <button id="confirm-cancel-btn" class="confirm-btn confirm-btn-cancel" data-i18n="cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- Button bar with about and settings icons -->
  <div class="button-bar">
    <button id="settings-btn" class="icon-btn" title="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
        <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.901-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
      </svg>
    </button>
    <button id="about-btn" class="icon-btn" title="About">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
        <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
      </svg>
    </button>
  </div>
  
  <script src="../js/utils/theme.js"></script>
  <script src="../js/pinned-list.js" type="module"></script>
  <script src="../js/utils/theme-init.js"></script>
</body>

</html>
